    /* Filter only rendered typography. All spatial values are fixed CSS pixels. */
    .identity, .intro, .contact, .projects, .years, .title {
      filter: url(#print-texture);
    }
    .text-effect-definitions {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .cover-footer {
      position: absolute;
      left: .875vw;
      right: .875vw;
      bottom: 24px;
      display: flex;
      flex-direction: column;
    }
    p, h1 { margin: 0; font-size: inherit; font-weight: inherit; }
    a { color: inherit; text-decoration: underline; text-underline-offset: .08em; text-decoration-thickness: .055em; }
    a:hover { opacity: .55; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
    .identity { position: absolute; top: 24px; left: 24px; }
    .intro { position: absolute; top: 24px; left: 26.0625%; width: 23.3125%; max-width: 373px; }
    .contact { position: absolute; top: 24px; right: 24px; white-space: nowrap; }
    .projects { position: absolute; top: calc(37.5% - 7px); left: 26.0625%; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }
    .years { align-self: flex-end; margin-right: .625vw; font-size: 5vw; line-height: .75; font-weight: 600; white-space: nowrap; }
    .title { margin-top: -3.375vw; font-size: 17.9375vw; line-height: 1; letter-spacing: -.06em; white-space: nowrap; }
    @media (max-width: 700px) {
      .cover {
        --mobile-title-size: 124px;
        display: flex;
        flex-direction: column;
        min-height: 100svh;
        height: auto;
        padding: 24px 16px 32px;
        font-size: 32px;
        line-height: 36px;
      }
      .cover > * { flex-shrink: 0; }
      .identity { position: static; }
      .intro {
        position: static;
        width: min(373px, calc(100% + 3px));
        max-width: 373px;
        margin-top: 24px;
        margin-left: 1px;
      }
      .projects {
        position: static;
        align-self: flex-start;
        margin-top: 64px;
        margin-left: 1px;
        margin-bottom: 64px;
        line-height: 40px;
      }
      .cover-footer {
        position: static;
        display: flex;
        flex-direction: column;
        align-self: flex-end;
        width: 100%;
        margin-top: auto;
      }
      .years {
        align-self: flex-end;
        margin-right: 0;
        font-size: 40px;
        line-height: 1;
      }
      .title {
        width: 100%;
        margin-top: 8px;
        font-size: var(--mobile-title-size);
        line-height: .8;
        text-align: right;
        white-space: normal;
      }
      .title > span { display: block; width: 100%; }
      .title > span:first-child { text-align: left; }
      .title > span:last-child { text-align: right; }
      .contact {
        position: static;
        align-self: center;
        margin-top: 48px;
      }
    }
    @media (min-width: 701px) and (max-height: 650px) {
      .cover { min-height: 520px; }
      .projects { top: calc(37.5% - 7px); }
    }
    @media (prefers-reduced-motion: no-preference) { a { transition: opacity .15s ease; } }
  </style>

  <svg class="text-effect-definitions" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="print-texture" x="-10%" y="-30%" width="120%" height="160%"
              filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse"
              color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2"
                      seed="7895" result="edgeNoise" />
        <feDisplacementMap in="SourceGraphic" in2="edgeNoise" scale="0.8"
                           xChannelSelector="R" yChannelSelector="G" result="printedEdges" />
        <feGaussianBlur in="printedEdges" stdDeviation="0.4" result="softInk" />
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2"
                      seed="5640" result="inkNoise" />
        <feColorMatrix in="inkNoise" type="luminanceToAlpha" result="inkAlpha" />
        <feComponentTransfer in="inkAlpha" result="fineInkMask">
          <feFuncA type="linear" slope="0.008" intercept="0.992" />
        </feComponentTransfer>
        <feComposite in="softInk" in2="fineInkMask" operator="in" />
      </filter>
    </defs>
  </svg>
